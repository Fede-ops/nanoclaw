name: Deploy Familienkalender to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/calendar-app-prototype-6bqer
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: calendar-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: calendar-app

      - name: Build
        run: npm run build
        working-directory: calendar-app
        env:
          VITE_DEPLOY_BASE: /nanoclaw/

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: calendar-app/dist
          branch: gh-pages
          clean: true
          single-commit: true
